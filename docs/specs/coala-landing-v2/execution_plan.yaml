# Risk Register
risks:
  - id: R01
    description: "Three.js bundle may exceed budget if not split correctly"
    mitigation: "Manual chunk in vite.config.ts; lazy load; fallback to Canvas 2D"
    owner: flash-fast-coder
    phase: 6

  - id: R02
    description: "Canvas particle swarm may drop FPS on low-end mobile"
    mitigation: "Reduce particle count by 60% on mobile; use requestAnimationFrame with delta time"
    owner: flash-fast-coder
    phase: 3

  - id: R03
    description: "CSP may block legitimate inline styles from Tailwind"
    mitigation: "Use 'unsafe-inline' for style-src (acceptable for static site) or nonce plugin"
    owner: security-auditor
    phase: 2

  - id: R04
    description: "Custom modes data from external YAML may drift"
    mitigation: "Copy/paste verified subset into modes.ts; add comment with source commit SHA"
    owner: evidence-checker
    phase: 1

  - id: R05
    description: "GitHub Pages base path mismatch causes 404 on assets"
    mitigation: "Double-check base in vite.config.ts matches repo name exactly"
    owner: evidence-checker
    phase: 8


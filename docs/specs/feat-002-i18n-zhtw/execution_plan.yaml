# Risk Register
risks:
  - id: R01
    description: "Confusión de usuario entre 中文 (simplificado) y 繁體中文 (tradicional)"
    mitigation: "Labels claramente diferenciados en LanguageSwitcher: 🇨🇳 中文 vs 🇹🇼 繁體中文"
    owner: flash-fast-coder
    phase: 8

  - id: R02
    description: "Traducción automática introduce caracteres simplificados accidentalmente"
    mitigation: "Validación manual de caracteres clave (體/体, 軟/软, 資/资); diff visual con zh.json"
    owner: evidence-checker
    phase: 5

  - id: R03
    description: "Aumento de bundle size por zh-TW.json"
    mitigation: "Archivo JSON ~5KB; lazy load si excede budget de 500KB"
    owner: evidence-checker
    phase: 12

  - id: R04
    description: "Textos ZH-TW exceden ancho de contenedores en mobile"
    mitigation: "CSS word-break: keep-all + overflow-wrap: break-word + test responsive específico"
    owner: flash-fast-coder
    phase: 9

  - id: R05
    description: "Regresión silenciosa en detectLanguage para ES/EN/ZH"
    mitigation: "Tests de regresión explícitos en Phase 12 task 134"
    owner: evidence-checker
    phase: 12

  - id: R06
    description: "Font 'Noto Sans TC' no disponible → tofu characters"
    mitigation: "Font stack con 6 fallbacks hasta system-ui; verificar en 3 navegadores"
    owner: test-engineer
    phase: 9


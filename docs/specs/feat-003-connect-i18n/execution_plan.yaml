# Risk Register
risks:
  - id: R01
    description: "TypewriterText no se reinicia al cambiar idioma — flicker o texto mezclado"
    mitigation: "useTypingEffect ya tiene reset() en cambio de text. Verificar con test unitario (Phase 5 task 52)"
    owner: qwen-fast-checker
    phase: 5

  - id: R02
    description: "Nuevas claves JSON faltantes en zh-TW.json — build falla por tipo Record<Language, typeof esContent>"
    mitigation: "TypeScript fuerza exhaustividad; si falta una key, el build no compila. Validación estructural en Phase 4 task 40"
    owner: evidence-checker
    phase: 4

  - id: R03
    description: "Componente se rompe al cambiar idioma porque la estructura JSON es diferente entre idiomas"
    mitigation: "Todos los JSON comparten la misma estructura (forzado por Record<Language, typeof esContent>). Validación cross-file en CI/CD"
    owner: evidence-checker
    phase: 14

  - id: R04
    description: "Regresión en animaciones Framer Motion — re-render por cambio de idioma interrumpe whileInView"
    mitigation: "Framer Motion maneja re-renders sin reiniciar animaciones. SectionReveal y AnimatedCard no dependen del idioma"
    owner: test-engineer
    phase: 14

  - id: R05
    description: "Footer pierde el icono Heart en madeWithLove al mover a JSON"
    mitigation: "El corazón se mantiene como componente <Heart>; solo el texto 'para la comunidad open source' va al JSON"
    owner: flash-fast-coder
    phase: 13

  - id: R06
    description: "HeroSection title 'COALA-SwarmOPS' con span cyan se rompe al usar content.title"
    mitigation: "El nombre es propio y no se traduce. Se usa content.title para el texto pero se preserva el markup con <span> para el estilo"
    owner: flash-fast-coder
    phase: 5

  - id: R07
    description: "Cambios en 9 componentes simultáneos generan conflictos de merge"
    mitigation: "Cada componente es independiente; las fases 5-13 pueden ejecutarse en paralelo sin conflictos porque modifican archivos distintos"
    owner: senior
    phase: 15

  - id: R08
    description: "Lighthouse audit con idioma ZH-TW podría reportar error de lang attribute"
    mitigation: "document.documentElement.lang se configura correctamente en useLanguage.tsx (FEAT-002). Verificar en Phase 15 task 145"
    owner: evidence-checker
    phase: 15

